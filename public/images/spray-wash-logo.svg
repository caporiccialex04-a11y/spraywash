<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title">
  <title id="title">Spray Wash Car Wash — Powered by Under-Pressure</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- Pressure gun -->
  <g transform="translate(40,145)">
    <path d="M10 55 L55 55 L70 20 L95 20 L95 40 L78 40 L70 70 L55 70 L55 95 L10 95 Z" fill="#111"/>
    <rect x="95" y="24" width="520" height="14" rx="3" fill="#f5f5f5" stroke="#111" stroke-width="6"/>
    <circle cx="95" cy="31" r="10" fill="#111"/>
  </g>
  <!-- Spray -->
  <g transform="translate(655,120)" fill="#111">
    <path d="M0 50 L70 10" stroke="#111" stroke-width="4"/>
    <path d="M0 55 L85 45" stroke="#111" stroke-width="4"/>
    <path d="M0 60 L85 70" stroke="#111" stroke-width="4"/>
    <path d="M0 65 L70 100" stroke="#111" stroke-width="4"/>
    <circle cx="78" cy="8" r="5"/><circle cx="95" cy="40" r="6"/><circle cx="92" cy="78" r="5"/>
    <circle cx="68" cy="105" r="4"/><circle cx="55" cy="20" r="3"/>
  </g>
  <!-- SPRAY WASH text as paths-like using text -->
  <text x="450" y="185" text-anchor="middle" font-family="Arial Black, Impact, Haettenschweiler, sans-serif" font-size="96" font-style="italic" font-weight="900" fill="#E87722" stroke="#111" stroke-width="10" paint-order="stroke fill" letter-spacing="2">SPRAY WASH</text>
  <!-- CAR WASH -->
  <line x1="250" y1="235" x2="330" y2="235" stroke="#E87722" stroke-width="6"/>
  <line x1="570" y1="235" x2="650" y2="235" stroke="#E87722" stroke-width="6"/>
  <text x="450" y="245" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="42" font-weight="800" fill="#111" letter-spacing="6">CAR WASH</text>
  <!-- Banner -->
  <path d="M180 290 L720 290 L755 330 L720 370 L180 370 L145 330 Z" fill="#111"/>
  <text x="450" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-style="italic" font-weight="800" letter-spacing="2">
    <tspan fill="#ffffff">POWERED BY </tspan><tspan fill="#E87722">UNDER-PRESSURE</tspan>
  </text>
</svg>
